<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="./css/ingresar.css">
</head>
<script src="./datos/usuarios.js"></script>
<script>
  function verificarUsuario() {
    let validar = false;
    let estado = "";
    let correo = document.getElementById("email").value.trim();
    let contraseña = document.getElementById("password").value;
    let lista = listaUsuarios;
    lista.forEach(element => {
      if (element.correo === correo && element.contraseña ===
        contraseña && element.estado != "bloqueado") {
        element.actualizarUltimoAcceso();
        sessionStorage.setItem("correo", correo);
        validar = true;
        estado = element.perfil;
      } else {
        element.registrarAccesoErroneo();
      }
    });
    if (validar && estado == "usuario") {
      location.href = "./usuario.html";
    } else if (validar && estado == "admin") {
      location.href = "./añadirComic.html";
    } else if (validar && estado == "moderador") {
      location.href = "./validarUsuarios.html";
    } else {
      location.href = "./inicio.html";
    }
  }
</script>

<body>

  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="********" required>
      </div>

      <button type="button" class="login-button" onclick="verificarUsuario()">Ingresar</button>
    </form>

    <div class="extra-options">
      <p><a href="./registrar.html">Crear una cuenta</a></p>
    </div>
  </div>

</body>

</html>
