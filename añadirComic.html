<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="./css/añadirComic.css">
</head>

<script src="./datos/listaComics.js"></script>
<script src="./datos/añadirComic.js"></script>
<script src="./datos/comicsUsuarios.js"></script>

<body>
    <div class="container">
        <h2>Añadir/Reponer comic</h2>
        <div id="avisoComic"></div>
         <p><a href="./comicMasVendidos.html">Ver los comics mas vebdidos</a></p>
        <form action="#" method="POST">
            <label for="titulo">Titulo del comic</label>
            <input type="text" id="titulo" name="titulo" required />

            <label for="autor">Autores(si hay mas de uno separarlo por comas)</label>
            <input type="text" id="autor" name="autor" required />

            <label for="editorial">editorial</label>
            <input type="text" id="editorial" name="editorial" required />

            <label for="añoPublicacion">añoPublicacion</label>
            <input type="number" id="añoPublicacion" name="añoPublicacion" min="1938" required />

            <label for="personaje">Personaje o equipo</label>
            <input type="text" id="personaje" name="personaje" required />

            <label for="precio">precio</label>
            <input type="number" id="precio" name="precio" min="0" step="any" required />

            <label for="cantidad">cantidad</label>
            <input type="number" id="cantidad" name="cantidad"  min="1" required />

            <label for="descripcion">descripcion</label>
            <input type="text" id="descripcion" name="descripcion" required />

            <label for="original">¿es original o no?</label>
            <input type="checkbox" id="original" name="original" required />

            <label for="formato">¿Es fisico,digital,tapa dura o tapa blanda?</label>
            <input type="text" id="formato" name="formato" pattern="físico|digital|tapa dura|tapa blanda" required />
            <button type="button" onclick="anadirComic()" class="btn-submit">Registrar</button>
        </form>
    </div>
</body>
